function NilaiDetail({ kode, isAdmin, onBack }) {
  const { notify } = useContext(Ctx);
  const [d, setD] = useState(null);
  const [tab, setTab] = useState('koreksi');
  const [soalU, setSoalU] = useState('');
  const [edit, setEdit] = useState({});
  const [busy, setBusy] = useState(false);
  const load = async () => {
    try {
      const r = await api('nilaiDetail', { kodeMapel: kode }, { fresh: true });
      setD(r); setEdit({});
      const u = r.soal.filter(s => s.jenis === 'URAIAN');
      if (!u.length) setTab(t => t === 'koreksi' ? 'rekap' : t);
      setSoalU(x => x || (u[0] ? u[0].no : ''));
    } catch (e) { notify(e.message, 'err'); }
  };
  useEffect(() => { load(); }, [kode]);
  if (!d) return <div className="card muted">Memuat nilai…</div>;

  const uraian = d.soal.filter(s => s.jenis === 'URAIAN');
  const objektif = d.soal.filter(s => s.jenis !== 'URAIAN');
  const ikut = d.siswa.filter(s => s.key);
  const dirty = Object.keys(edit).length > 0;
  const simpan = async () => {
    const by = {};
    Object.keys(edit).forEach(k => { const [key, no] = k.split('§'); (by[key] = by[key] || {})[no] = edit[k]; });
    setBusy(true);
    try { await api('simpanKoreksi', { kodeMapel: kode, items: Object.keys(by).map(key => ({ key, skor: by[key] })) }); notify('Koreksi tersimpan'); await load(); }
    catch (e) { notify(e.message, 'err'); }
    finally { setBusy(false); }
  };
  const kunci = async v => {
    if (v && !confirm('Kunci nilai ' + d.mapel.nama + ' kelas ' + d.mapel.tingkat + '?\nGuru tidak bisa mengubah koreksi lagi.')) return;
    try { await api('kunciNilai', { kodeMapel: kode, kunci: v }); notify(v ? 'Nilai dikunci (final)' : 'Kunci nilai dibuka'); await load(); }
    catch (e) { notify(e.message, 'err'); }
  };
  const unduh = () => {
    const rows = d.siswa.map((s, i) => {
      const h = s.hasil;
      const o = { No: i + 1, 'No. Peserta': s.no, NISN: s.nisn, Nama: s.nama, Kelas: s.kelas, Status: s.status };
      o['Skor otomatis'] = h ? h.obj : ''; o['Maks otomatis'] = h ? h.maksObj : '';
      if (uraian.length) { uraian.forEach(u => { o['Uraian ' + u.no] = h && s.uraian[u.no] != null ? s.uraian[u.no] : ''; }); o['Skor uraian'] = h ? h.uraian : ''; o['Maks uraian'] = h ? h.maksUraian : ''; }
      o['Nilai akhir'] = h ? h.nilai : '';
      o.Keterangan = !h ? 'Tidak hadir' : h.belum ? 'Uraian belum dikoreksi' : (s.status !== 'SELESAI' ? 'Belum selesai' : '');
      return o;
    });
    const ws = XLSX.utils.json_to_sheet(rows);
    ws['!cols'] = Object.keys(rows[0] || {}).map(k => ({ wch: k === 'Nama' ? 30 : Math.max(8, k.length + 2) }));
    const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, 'Nilai');
    XLSX.writeFile(wb, `Nilai_${d.mapel.nama.replace(/[^\w]+/g, '_')}_Kelas_${d.mapel.tingkat}.xlsx`);
  };

  // analisis butir
  const analisis = d.soal.map(s => {
    if (s.jenis === 'URAIAN') {
      const v = ikut.map(x => x.uraian[s.no]).filter(x => x != null && x !== '');
      const rata = v.length ? v.reduce((a, b) => a + Number(b), 0) / v.length : null;
      return { s, n: v.length, p: rata == null ? null : rata / s.skor * 100, ket: v.length + ' dikoreksi · rata-rata ' + fmtN(rata) + ' dari ' + s.skor };
    }
    const n = ikut.length, b = ikut.filter(x => x.hasil && x.hasil.benar[s.no]).length, kosong = ikut.filter(x => !x.jawab[s.no]).length;
    let dist = '';
    if (s.jenis === 'PG' || s.jenis === 'BS') {
      const c = {}; ikut.forEach(x => { const a = x.jawab[s.no]; if (a) c[a] = (c[a] || 0) + 1; });
      dist = Object.keys(c).sort().map(k => `${k}:${c[k]}`).join('  ');
    }
    return { s, n, p: n ? b / n * 100 : null, ket: `${b}/${n} benar${kosong ? ` · ${kosong} kosong` : ''}${dist ? ' · pilihan ' + dist : ''}` };
  });
  const kategori = p => p == null ? ['–', 'b-abu'] : p >= 70 ? ['Mudah', 'b-hijau'] : p >= 30 ? ['Sedang', 'b-biru'] : ['Sukar', 'b-merah'];
  const nilaiAda = ikut.filter(x => x.hasil).map(x => x.hasil.nilai);
  const rata = nilaiAda.length ? nilaiAda.reduce((a, b) => a + b, 0) / nilaiAda.length : null;
  const su = uraian.find(u => u.no === soalU);

  return (
    <>
      <div className="card">
        <div className="row" style={{ justifyContent: 'space-between' }}>
          <div className="row">
            <button className="btn" onClick={() => { if (dirty && !confirm('Ada koreksi belum disimpan. Tetap kembali?')) return; onBack(); }}>← Daftar mapel</button>
            <h3 style={{ margin: 0 }}>{d.mapel.nama} — Kelas {d.mapel.tingkat}</h3>
            {d.terkunci ? <span className="badge b-hijau">🔒 Nilai final</span> : null}
          </div>
          <div className="row">
            <button className="btn" onClick={unduh}>⬇ Unduh nilai (Excel)</button>
            {isAdmin && (d.terkunci ? <button className="btn" onClick={() => kunci(false)}>Buka kunci nilai</button> : <button className="btn success" onClick={() => kunci(true)}>🔒 Kunci nilai (final)</button>)}
          </div>
        </div>
        <div className="row" style={{ marginTop: 10 }}>
          <span className="muted">Ikut ulangan: <b>{ikut.length}</b> dari {d.siswa.length} · Rata-rata: <b>{fmtN(rata)}</b> · Tertinggi: <b>{fmtN(nilaiAda.length ? Math.max(...nilaiAda) : null)}</b> · Terendah: <b>{fmtN(nilaiAda.length ? Math.min(...nilaiAda) : null)}</b></span>
        </div>
        <div className="row" style={{ marginTop: 12, gap: 6 }}>
          {uraian.length > 0 && <button className={'btn ' + (tab === 'koreksi' ? 'primary' : '')} onClick={() => setTab('koreksi')}>✏ Koreksi uraian</button>}
          <button className={'btn ' + (tab === 'rekap' ? 'primary' : '')} onClick={() => setTab('rekap')}>📋 Rekap nilai</button>
          <button className={'btn ' + (tab === 'analisis' ? 'primary' : '')} onClick={() => setTab('analisis')}>📈 Analisis soal</button>
        </div>
      </div>

      {tab === 'koreksi' && su && (
        <>
          <div className="card">
            <div className="row" style={{ gap: 6, marginBottom: 10 }}>
              {uraian.map(u => {
                const sisa = ikut.filter(x => x.uraian[u.no] == null && edit[x.key + '§' + u.no] == null).length;
                return <button key={u.no} className={'btn sm ' + (soalU === u.no ? 'primary' : '')} onClick={() => setSoalU(u.no)}>Soal {u.no} {sisa ? <span className="badge b-kuning" style={{ marginLeft: 4 }}>{sisa}</span> : '✓'}</button>;
              })}
            </div>
            <div style={{ whiteSpace: 'pre-wrap', fontWeight: 600 }}>{su.q}</div>
            {su.img && <img src={driveImg(su.img)} alt="" style={{ maxHeight: 180, marginTop: 8 }} />}
            {su.kunci && <div className="opsi" style={{ background: '#f1f5f9', marginTop: 8 }}>Pedoman/rubrik: {su.kunci}</div>}
            <div className="hint" style={{ marginTop: 6 }}>Skor maksimal soal ini: <b>{su.skor}</b>. Boleh desimal (mis. 2,5). Kosongkan untuk "belum dikoreksi".</div>
          </div>
          <div className="card" style={{ padding: 0 }}>
            <div className="tablewrap" style={{ border: 0, maxHeight: '58vh' }}>
              <table className="data">
                <thead><tr><th>No. Peserta</th><th>Nama</th><th style={{ width: '55%' }}>Jawaban siswa</th><th>Skor (0–{su.skor})</th></tr></thead>
                <tbody>
                  {ikut.map(x => {
                    const k = x.key + '§' + su.no;
                    const val = edit[k] != null ? edit[k] : (x.uraian[su.no] != null ? String(x.uraian[su.no]).replace('.', ',') : '');
                    return (
                      <tr key={x.key}>
                        <td style={{ fontFamily: 'monospace' }}>{x.no}</td><td>{x.nama}</td>
                        <td style={{ whiteSpace: 'pre-wrap' }}>{x.jawab[su.no] || <span className="muted">(tidak dijawab)</span>}</td>
                        <td><input value={val} disabled={d.terkunci} inputMode="decimal" style={{ width: 80, background: edit[k] != null ? '#fef9c3' : undefined }}
                          onChange={e => setEdit({ ...edit, [k]: e.target.value })} /></td>
                      </tr>
                    );
                  })}
                </tbody>
              </table>
            </div>
          </div>
          <div className="card row" style={{ justifyContent: 'space-between', position: 'sticky', bottom: 0 }}>
            <span className="muted">{dirty ? `${Object.keys(edit).length} skor belum disimpan` : 'Semua perubahan tersimpan'}</span>
            <button className="btn primary" disabled={!dirty || busy || d.terkunci} onClick={simpan}>{busy ? 'Menyimpan…' : '💾 Simpan koreksi'}</button>
          </div>
        </>
      )}

      {tab === 'rekap' && (
        <div className="card" style={{ padding: 0 }}>
          <div className="tablewrap" style={{ border: 0, maxHeight: '65vh' }}>
            <table className="data">
              <thead><tr><th>#</th><th>No. Peserta</th><th>Nama</th><th>Status</th><th>Skor otomatis</th>{uraian.length > 0 && <th>Skor uraian</th>}<th>Nilai akhir</th><th>Ket.</th></tr></thead>
              <tbody>
                {d.siswa.map((x, i) => (
                  <tr key={x.no} style={!x.hasil ? { color: 'var(--muted)' } : null}>
                    <td>{i + 1}</td><td style={{ fontFamily: 'monospace' }}>{x.no}</td><td>{x.nama}</td>
                    <td>{x.status === 'SELESAI' ? <span className="badge b-hijau">Selesai</span> : x.status === 'TIDAK HADIR' ? <span className="badge b-abu">Tidak hadir</span> : <span className="badge b-biru">{x.status}</span>}</td>
                    <td>{x.hasil ? `${fmtN(x.hasil.obj)} / ${x.hasil.maksObj}` : '–'}</td>
                    {uraian.length > 0 && <td>{x.hasil ? `${fmtN(x.hasil.uraian)} / ${x.hasil.maksUraian}` : '–'}</td>}
                    <td><b>{x.hasil ? fmtN(x.hasil.nilai) : '–'}</b></td>
                    <td className="hint">{x.hasil && x.hasil.belum ? `${x.hasil.belum} uraian belum dikoreksi` : ''}{x.pelanggaran ? ` · ${x.pelanggaran}× pelanggaran` : ''}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </div>
      )}

      {tab === 'analisis' && (
        <div className="card" style={{ padding: 0 }}>
          <div className="tablewrap" style={{ border: 0, maxHeight: '65vh' }}>
            <table className="data">
              <thead><tr><th>No</th><th>Jenis</th><th style={{ width: '38%' }}>Soal</th><th>Kunci</th><th>Tingkat kesulitan</th><th>Rincian</th></tr></thead>
              <tbody>
                {analisis.map(({ s, p, ket }) => {
                  const [kt, kc] = kategori(p);
                  return (
                    <tr key={s.no}>
                      <td>{s.no}</td><td><span className="badge b-biru">{s.jenis}</span></td>
                      <td style={{ fontSize: 12.5 }}>{String(s.q).slice(0, 140)}{String(s.q).length > 140 ? '…' : ''}</td>
                      <td style={{ fontFamily: 'monospace' }}>{s.jenis === 'URAIAN' ? '–' : s.kunci}</td>
                      <td><span className={'badge ' + kc}>{kt}</span>{p != null && <div style={{ height: 6, background: '#e2e8f0', borderRadius: 9, marginTop: 4, width: 90 }}><div style={{ height: '100%', width: p + '%', background: p >= 70 ? 'var(--hijau)' : p >= 30 ? 'var(--biru2)' : 'var(--merah)', borderRadius: 9 }} /></div>}<div className="hint">{p == null ? '' : fmtN(p) + '%'}</div></td>
                      <td className="hint">{ket}</td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
          </div>
          <p className="hint" style={{ padding: '0 14px 12px' }}>Mudah: ≥ 70% siswa benar · Sedang: 30–69% · Sukar: &lt; 30%. Soal yang hampir semua siswa salah perlu diperiksa — mungkin kuncinya keliru. Jika kunci diperbaiki di Bank Soal, nilai otomatis dihitung ulang.</p>
        </div>
      )}
    </>
  );
}

/* ---------------- Monitoring Pengawas (Tahap 2) ---------------- */
const ST_LABEL = { BELUM: ['Belum login', 'b-abu'], LOGIN: ['Sudah login', 'b-biru'], MENGERJAKAN: ['Mengerjakan', 'b-biru'], TERKUNCI: ['🔒 Terkunci', 'b-merah'], SELESAI: ['✓ Selesai', 'b-hijau'] };
const fmtDetik = t => { if (t == null) return '–'; const m = Math.floor(t / 60), s = t % 60; return (m >= 60 ? Math.floor(m / 60) + ':' + String(m % 60).padStart(2, '0') : m) + ':' + String(s).padStart(2, '0'); };

function MonitorPage({ user }) {
  const { notify } = useContext(Ctx);
  const isAdmin = user.peran === 'admin';
  const [d, setD] = useState(null);
  const [q, setQ] = useState({ tanggal: '', slot: '', ruang: '' });
  const [auto, setAuto] = useState(true);
  const [busy, setBusy] = useState('');
  const [sisaTok, setSisaTok] = useState(0);
  const [fStatus, setFStatus] = useState('');
  const [lihatLog, setLihatLog] = useState(null);
  const [foto, setFoto] = useState({});
  useEffect(() => { api('getFoto').then(setFoto).catch(() => { }); }, []);
  const qRef = useRef(q); qRef.current = q;

  const load = async silent => {
    try {
      const r = await api('monitor', qRef.current, { fresh: true, silent });
      setD(r);
      if (r.token) setSisaTok(r.token.sisaDetik);
      if (!qRef.current.tanggal || !qRef.current.slot) setQ(x => ({ ...x, tanggal: x.tanggal || r.tanggal, slot: x.slot || r.slot }));
    } catch (e) { if (!silent) notify(e.message, 'err'); }
  };
  useEffect(() => { load(); }, [q.tanggal, q.slot, q.ruang]);
  useEffect(() => { if (!auto) return; const t = setInterval(() => load(true), 15000 + Math.random() * 5000); return () => clearInterval(t); }, [auto]);
  useEffect(() => { const t = setInterval(() => setSisaTok(s => { if (s === 1) load(true); return Math.max(0, s - 1); }), 1000); return () => clearInterval(t); }, []);
  useEffect(() => { if (!d) return; const t = setInterval(() => setD(x => x && ({ ...x, siswa: x.siswa.map(s => s.sisa ? { ...s, sisa: s.sisa - 1 } : s) })), 1000); return () => clearInterval(t); }, [!!d]);

  const aksi = async (nama, payload, pesan) => {
    setBusy(nama + (payload.no || ''));
    try { await api(nama, payload); notify(pesan); await load(true); }
    catch (e) { notify(e.message, 'err'); }
    finally { setBusy(''); }
  };
  const unduhNilai = async () => {
    try {
      const rows = await api('unduhNilai', { tanggal: q.tanggal });
      if (!rows.length) return notify('Belum ada hasil ujian pada tanggal ini', 'err');
      const ws = XLSX.utils.json_to_sheet(rows);
      ws['!cols'] = Object.keys(rows[0]).map(k => ({ wch: Math.max(8, Math.min(40, k.length + 4)) }));
      const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, 'Nilai');
      XLSX.writeFile(wb, 'Nilai_' + q.tanggal + '.xlsx');
    } catch (e) { notify(e.message, 'err'); }
  };

  if (!d) return <div className="card muted">Memuat monitoring…</div>;
  const hitung = {}; d.siswa.forEach(s => { hitung[s.status] = (hitung[s.status] || 0) + 1; });
  const shown = d.siswa.filter(s => !fStatus || s.status === fStatus);
  const aktifRuang = d.siswa.filter(s => s.status === 'MENGERJAKAN' || s.status === 'TERKUNCI');

  return (
    <>
      <div className="grid" style={{ gridTemplateColumns: 'minmax(220px,300px) 1fr', alignItems: 'stretch' }}>
        <div className="card" style={{ textAlign: 'center', marginBottom: 0 }}>
          {d.token ? (<>
            <div className="muted">TOKEN UJIAN</div>
            <div style={{ fontSize: 44, fontWeight: 900, letterSpacing: 8, color: 'var(--biru)', fontFamily: 'monospace' }}>{d.token.token}</div>
            <div className="hint">berganti dalam <b>{fmtDetik(sisaTok)}</b> · berlaku {d.token.menit} menit (+ token sebelumnya)</div>
          </>) : <div className="muted" style={{ paddingTop: 20 }}>Token hanya tampil untuk ulangan hari ini.</div>}
        </div>
        <div className="card" style={{ marginBottom: 0 }}>
          <div className="row">
            <label style={{ margin: 0 }}>Tanggal<input type="date" value={q.tanggal} onChange={e => setQ({ ...q, tanggal: e.target.value, slot: '' })} style={{ width: 160 }} /></label>
            <label style={{ margin: 0 }}>Jam ujian
              <select value={q.slot} onChange={e => setQ({ ...q, slot: e.target.value })} style={{ width: 170 }}>
                {!d.slots.length && <option value="">— tidak ada jadwal —</option>}
                {d.slots.map((s, i) => <option key={s} value={s}>Jam ke-{i + 1} ({s})</option>)}
              </select>
            </label>
            <label style={{ margin: 0 }}>Ruang
              <select value={q.ruang} onChange={e => setQ({ ...q, ruang: e.target.value })} style={{ width: 170 }}>
                <option value="">Semua ruang</option>{d.ruang.map(r => <option key={r.kode} value={r.kode}>{r.nama}</option>)}
              </select>
            </label>
          </div>
          <div className="row" style={{ marginTop: 10 }}>
            <span className="hint">Mapel: {d.mapel.map(m => `Kls ${m.tingkat} ${m.nama}`).join(' · ') || '–'}</span>
          </div>
          <div className="row" style={{ marginTop: 10 }}>
            <label style={{ margin: 0, display: 'flex', gap: 6, alignItems: 'center' }}><input type="checkbox" checked={auto} onChange={e => setAuto(e.target.checked)} style={{ width: 'auto' }} /> Perbarui otomatis (±15 dtk)</label>
            <button className="btn sm" onClick={() => load()}>🔄 Perbarui</button>
            {aktifRuang.length > 0 && <button className="btn sm" disabled={!!busy} onClick={() => { const m = prompt(`Tambah waktu untuk ${aktifRuang.length} siswa yang sedang mengerjakan${q.ruang ? ' di ruang ini' : ''}. Berapa menit?`, '10'); if (m) aksi('tambahWaktu', { menit: Number(m), daftar: aktifRuang.map(s => ({ jid: s.jid, no: s.no })) }, `+${m} menit untuk ${aktifRuang.length} siswa`); }}>⏱ Tambah waktu semua</button>}
            {isAdmin && <button className="btn sm" onClick={unduhNilai}>⬇ Unduh nilai tanggal ini</button>}
          </div>
        </div>
      </div>

      <div className="grid stats" style={{ marginTop: 16 }}>
        {['BELUM', 'LOGIN', 'MENGERJAKAN', 'TERKUNCI', 'SELESAI'].map(k => (
          <button key={k} className="stat" style={{ textAlign: 'left', cursor: 'pointer', outline: fStatus === k ? '2px solid var(--biru2)' : 'none' }} onClick={() => setFStatus(fStatus === k ? '' : k)}>
            <span className={'badge ' + ST_LABEL[k][1]}>{ST_LABEL[k][0]}</span><b>{hitung[k] || 0}</b>
          </button>
        ))}
      </div>

      <div className="card" style={{ padding: 0, marginTop: 16 }}>
        <div className="tablewrap" style={{ border: 0, maxHeight: '60vh' }}>
          <table className="data">
            <thead><tr><th>Meja</th><th>No. Peserta</th><th>Nama</th><th>Mapel</th><th>Status</th><th>Dijawab</th><th>Sisa waktu</th><th>Pelanggaran</th><th>Aksi</th></tr></thead>
            <tbody>
              {shown.map(s => (
                <tr key={s.jid + s.no} style={s.status === 'TERKUNCI' ? { background: '#fef2f2' } : null}>
                  <td>{s.meja}</td><td style={{ fontFamily: 'monospace' }}>{s.no}</td><td><div style={{ display: 'flex', gap: 8, alignItems: 'center' }}>{foto[s.fk] && <img src={foto[s.fk]} alt="" style={{ width: 30, height: 40, objectFit: 'cover', borderRadius: 4 }} />}<div><b>{s.nama}</b><div className="hint">{s.kelas} · {s.ruang}</div></div></div></td>
                  <td>{s.mapel}</td>
                  <td><span className={'badge ' + ST_LABEL[s.status][1]}>{ST_LABEL[s.status][0]}</span></td>
                  <td>{s.n ? <>{s.terjawab}/{s.n}<div style={{ height: 5, background: '#e2e8f0', borderRadius: 9, marginTop: 3, width: 70 }}><div style={{ height: '100%', width: (s.terjawab / s.n * 100) + '%', background: 'var(--hijau)', borderRadius: 9 }} /></div></> : '–'}</td>
                  <td style={{ fontVariantNumeric: 'tabular-nums', color: s.sisa != null && s.sisa < 300 ? 'var(--merah)' : undefined }}>{s.status === 'SELESAI' ? '–' : fmtDetik(s.sisa)}{s.tambah ? <div className="hint">+{s.tambah} mnt</div> : null}</td>
                  <td>{s.viol ? <button className="btn sm danger" onClick={() => setLihatLog(s)}>{s.viol}× lihat</button> : <span className="muted">0</span>}</td>
                  <td style={{ whiteSpace: 'nowrap' }}>
                    {s.status === 'TERKUNCI' && <button className="btn sm success" disabled={!!busy} onClick={() => aksi('bukaKunci', { jadwalId: s.jid, no: s.no }, 'Kunci dibuka: ' + s.nama)}>🔓 Buka kunci</button>}{' '}
                    {(s.status === 'MENGERJAKAN' || s.status === 'TERKUNCI') && <button className="btn sm" disabled={!!busy} onClick={() => aksi('tambahWaktu', { jadwalId: s.jid, no: s.no, menit: 5 }, '+5 menit: ' + s.nama)}>+5′</button>}{' '}
                    {s.status !== 'BELUM' && s.status !== 'SELESAI' && <button className="btn sm" disabled={!!busy} title="Untuk siswa yang ganti HP / HP mati" onClick={() => { if (confirm(`Reset perangkat ${s.nama}?\nSiswa bisa login lagi di HP lain. Jawaban tetap aman.`)) aksi('resetPerangkat', { no: s.no }, 'Perangkat direset: ' + s.nama); }}>📱 Reset</button>}
                  </td>
                </tr>
              ))}
              {!shown.length && <tr><td colSpan="9" className="muted" style={{ padding: 16 }}>Tidak ada peserta untuk pilihan ini.</td></tr>}
            </tbody>
          </table>
        </div>
      </div>
      <div className="card hint">
        <b>Panduan pengawas:</b> bacakan token ke siswa → siswa yang <span className="badge b-merah">🔒 Terkunci</span> angkat tangan → pastikan HP-nya kembali ke halaman ujian & tersemat → tekan <b>Buka kunci</b>, lalu siswa menekan "Sudah dibuka pengawas — Lanjutkan".
        <b> Reset</b> hanya untuk siswa yang ganti HP / HP mati / ter-logout. Semua tindakan tercatat di Log.
      </div>
      {lihatLog && (
        <Modal title={'Catatan pelanggaran — ' + lihatLog.nama} onClose={() => setLihatLog(null)}>
          <ul>{lihatLog.log.map((l, i) => <li key={i}>{l}</li>)}</ul>
          <p className="hint">Dicatat juga di berita acara digital (sheet Hasil).</p>
        </Modal>
      )}
    </>
  );
}

/* ---------------- Uji Server (simulasi pengguna serentak) ---------------- */
function UjiServerPage() {
  const [n, setN] = useState(63);
  const [mode, setMode] = useState('serentak');
  const [run, setRun] = useState(null);
  const [busy, setBusy] = useState(false);

  const mulai = async () => {
    const total = Math.min(150, Math.max(1, Number(n) || 63));
    const st = { done: 0, total, ok: 0, okRetry: 0, fail: 0, lat: [], server: [], err: {}, t0: Date.now(), mode };
    setBusy(true); setRun({ ...st });
    const satu = async k => {
      if (mode === 'bertahap') await sleep(Math.random() * 20000);
      const t = performance.now();
      try {
        const r = await callApi('ujiBeban', { n: k }, { silent: true });
        st.lat.push(performance.now() - t); st.server.push(r.data.ms);
        if (r.tries > 1) st.okRetry++; else st.ok++;
      } catch (e) { st.fail++; st.err[e.message] = (st.err[e.message] || 0) + 1; }
      st.done++; setRun({ ...st });
    };
    await Promise.all(Array.from({ length: total }, (_, k) => satu(k + 1)));
    st.t1 = Date.now(); setRun({ ...st }); setBusy(false);
  };

  const ringkas = arr => {
    if (!arr.length) return { avg: 0, p95: 0, max: 0 };
    const s = [...arr].sort((a, b) => a - b);
    return { avg: s.reduce((a, b) => a + b, 0) / s.length, p95: s[Math.min(s.length - 1, Math.floor(s.length * 0.95))], max: s[s.length - 1] };
  };
  const det = x => (x / 1000).toFixed(1).replace('.', ',') + ' dtk';
  const L = run ? ringkas(run.lat) : null;
  const S = run ? ringkas(run.server) : null;
  const selesai = run && run.done === run.total;
  let vonis = null;
  if (selesai) {
    const lambat = L.p95 > 15000 ? ` Namun 5% siswa menunggu lebih dari ${det(L.p95)} — sebaiknya login dibuat bertahap per ruang.` : '';
    if (run.fail === 0 && run.okRetry === 0) vonis = ['ok', '✅ AMAN — semua permintaan berhasil di percobaan pertama.' + lambat];
    else if (run.fail === 0) vonis = ['ok', `✅ AMAN — semua berhasil. ${run.okRetry} permintaan sempat ditolak karena server penuh, lalu berhasil lewat coba-ulang otomatis (siswa hanya menunggu sedikit lebih lama).` + lambat];
    else vonis = ['err', `⚠ ${run.fail} dari ${run.total} gagal walau sudah dicoba ulang ±45 detik. Gunakan pola login bertahap per ruang, periksa internet sekolah, lalu uji lagi.`];
  }

  return (
    <>
      <div className="card">
        <h3 style={{ marginTop: 0 }}>Simulasi siswa membuka aplikasi bersamaan</h3>
        <p className="hint" style={{ marginTop: 0 }}>Setiap "siswa tiruan" melakukan hal yang sama seperti saat ulangan: cek sesi login, mengambil data & soal, lalu menyimpan 40 jawaban sementara. Tidak ada data asli yang diubah.</p>
        <div className="row">
          <label style={{ margin: 0 }}>Jumlah siswa tiruan<input type="number" min="1" max="150" value={n} onChange={e => setN(e.target.value)} style={{ width: 110 }} /></label>
          <label style={{ margin: 0 }}>Pola
            <select value={mode} onChange={e => setMode(e.target.value)} style={{ width: 300 }}>
              <option value="serentak">Serentak — semua di detik yang sama (terberat)</option>
              <option value="bertahap">Bertahap — tersebar dalam 20 detik (seperti login nyata)</option>
            </select>
          </label>
          <button className="btn primary" onClick={mulai} disabled={busy}>{busy ? `Menguji… ${run ? run.done : 0}/${run ? run.total : n}` : '▶ Mulai uji'}</button>
        </div>
      </div>

      {run && (
        <div className="card">
          <div style={{ height: 10, background: '#e2e8f0', borderRadius: 99, overflow: 'hidden', marginBottom: 12 }}>
            <div style={{ height: '100%', width: (run.done / run.total * 100) + '%', background: run.fail ? 'var(--kuning)' : 'var(--hijau)', transition: 'width .2s' }} />
          </div>
          <div className="grid stats">
            <div className="stat"><span className="muted">Berhasil langsung</span><b style={{ color: 'var(--hijau)' }}>{run.ok}</b></div>
            <div className="stat"><span className="muted">Berhasil setelah coba ulang</span><b style={{ color: 'var(--kuning)' }}>{run.okRetry}</b></div>
            <div className="stat"><span className="muted">Gagal</span><b style={{ color: run.fail ? 'var(--merah)' : 'inherit' }}>{run.fail}</b></div>
            <div className="stat"><span className="muted">Waktu tunggu siswa</span><b>{det(L.avg)}</b><span className="hint">rata-rata · 95%: {det(L.p95)} · terlama: {det(L.max)}</span></div>
            <div className="stat"><span className="muted">Waktu kerja server</span><b>{Math.round(S.avg)} ms</b><span className="hint">terlama {Math.round(S.max)} ms</span></div>
          </div>
          {vonis && <div className={vonis[0]} style={{ marginTop: 14, fontSize: 14 }}>{vonis[1]}{selesai && <> Total {det(run.t1 - run.t0)} untuk {run.total} siswa ({run.mode}).</>}</div>}
          {Object.keys(run.err).length > 0 && <div className="err">{Object.entries(run.err).map(([k, v]) => `${v}× ${k}`).join('\n')}</div>}
        </div>
      )}

      <div className="card hint">
        <b>Cara membaca hasil:</b> "Waktu kerja server" yang kecil (puluhan–ratusan ms) berarti cache bekerja. "Waktu tunggu siswa" sudah termasuk internet & antrean Google.
        Uji dari satu perangkat sedikit lebih ringan daripada 63 HP sungguhan, jadi lakukan juga <b>gladi bersih</b> dengan siswa sebelum hari H.
        Uji sebaiknya di jaringan sekolah yang akan dipakai saat ulangan.
      </div>
    </>
  );
}

/* ---------------- App ---------------- */
const MENU = {
  admin: [
    ['sec', 'Utama'], ['dashboard', '🏠 Dashboard'],
    ['sec', 'Data Master'], ['siswa', '👨‍🎓 Peserta'], ['foto', '📷 Foto Peserta'], ['guru', '👩‍🏫 Guru'], ['mapel', '📚 Mapel & Pengampu'], ['ruang', '🚪 Ruang'], ['jadwal', '🗓 Jadwal'],
    ['sec', 'Ujian'], ['monitor', '📡 Monitoring'], ['nilai', '📊 Nilai & Koreksi'],
    ['sec', 'Soal'], ['soal', '📝 Bank Soal'],
    ['sec', 'Cetak'], ['kartu', '🪪 Kartu Peserta'], ['meja', '🪑 Kartu Meja'], ['hadir', '✍ Daftar Hadir'], ['ba', '📄 Berita Acara'],
    ['sec', 'Sistem'], ['uji', '🚦 Uji Server'], ['pengaturan', '⚙ Pengaturan']
  ],
  guru: [['sec', 'Guru'], ['soal', '📝 Soal Saya'], ['nilai', '📊 Nilai & Koreksi'], ['sec', 'Pengawas'], ['monitor', '📡 Monitoring']]
};
const TITLE = { dashboard: 'Dashboard', siswa: 'Data Peserta', foto: 'Foto Peserta', guru: 'Data Guru', mapel: 'Mapel & Guru Pengampu', ruang: 'Ruang Ulangan', jadwal: 'Jadwal Ulangan', soal: 'Bank Soal', kartu: 'Cetak Kartu Peserta', meja: 'Cetak Kartu Meja', hadir: 'Cetak Daftar Hadir', ba: 'Cetak Berita Acara', pengaturan: 'Pengaturan', uji: 'Uji Server (Simulasi Serentak)', monitor: 'Monitoring Ujian', nilai: 'Nilai & Koreksi' };

function App() {
  const [user, setUser] = useState(() => { try { return JSON.parse(localStorage.getItem('us_user')); } catch (e) { return null; } });
  const [page, setPage] = useState('');
  const [toast, setToast] = useState(null);
  const [retry, setRetry] = useState(null);
  const [open, setOpen] = useState(false);
  const notify = (msg, type = 'ok') => { setToast({ msg, type }); clearTimeout(window.__t); window.__t = setTimeout(() => setToast(null), type === 'err' ? 7000 : 3500); };

  useEffect(() => {
    const h = () => setUser(null);
    window.addEventListener('sesi-habis', h);
    const r1 = e => setRetry(e.detail), r2 = () => setRetry(null);
    window.addEventListener('api-retry', r1); window.addEventListener('api-ok', r2);
    return () => { window.removeEventListener('sesi-habis', h); window.removeEventListener('api-retry', r1); window.removeEventListener('api-ok', r2); };
  }, []);
  useEffect(() => { if (user) setPage(p => p || (user.peran === 'admin' ? 'dashboard' : 'soal')); }, [user]);

  const logout = async () => {
    try { await api('logout'); } catch (e) { }
    localStorage.removeItem('us_token'); localStorage.removeItem('us_user'); setUser(null); setPage('');
  };
  const go = p => { setPage(p); setOpen(false); window.scrollTo(0, 0); };

  if (!user) return <Ctx.Provider value={{ notify }}><Login onLogin={u => { setUser(u); setPage(''); }} />{toast && <div className={'toast ' + toast.type}>{toast.msg}</div>}{retry && <div className="retry-bar no-print">⏳ Server sedang sibuk — mencoba lagi otomatis ({retry.i}/{retry.max})…</div>}</Ctx.Provider>;

  const pages = {
    dashboard: <Dashboard go={go} />, siswa: <SiswaPage />, foto: <FotoPage />, guru: <GuruPage />, mapel: <MapelPage />, ruang: <RuangPage />,
    jadwal: <JadwalPage />, soal: <SoalPage user={user} />, kartu: <KartuPage />, meja: <KartuMejaPage />, hadir: <DaftarHadirPage awal="hadir" />, ba: <DaftarHadirPage awal="ba" />, pengaturan: <PengaturanPage />, uji: <UjiServerPage />, monitor: <MonitorPage user={user} />, nilai: <NilaiPage user={user} />
  };
  const allowed = MENU[user.peran].map(m => m[0]);

  return (
    <Ctx.Provider value={{ notify, user }}>
      <div className="layout">
        <aside className={'sidebar no-print' + (open ? ' open' : '')}>
          <div className="brand"><b>📝 Ulangan Semester</b><small>{user.nama} · {user.peran}</small></div>
          <nav>
            {MENU[user.peran].map(([k, l], i) => k === 'sec'
              ? <div className="sec" key={i}>{l}</div>
              : <button key={k} className={page === k ? 'active' : ''} onClick={() => go(k)}>{l}</button>)}
            <div className="sec">Akun</div>
            <button onClick={logout}>🚪 Keluar</button>
          </nav>
        </aside>
        <main className="main">
          <div className="topbar">
            <div className="row"><button className="btn menu-btn" onClick={() => setOpen(!open)}>☰</button><h2>{TITLE[page]}</h2></div>
          </div>
          {allowed.includes(page) ? <div key={page}>{pages[page]}</div> : null}
        </main>
      </div>
      {toast && <div className={'toast ' + toast.type}>{toast.msg}</div>}
      {retry && <div className="retry-bar no-print">⏳ Server sedang sibuk — mencoba lagi otomatis ({retry.i}/{retry.max})…</div>}
    </Ctx.Provider>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
