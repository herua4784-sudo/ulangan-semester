<script type="text/babel" data-presets="react">
/* ================================================================
   KONFIGURASI — tempel URL Web App Apps Script di bawah ini.
   Jika dibiarkan kosong, URL bisa diisi di halaman login.
================================================================ */
const API_URL = 'https://script.google.com/macros/s/AKfycbwfPCl63HEf9TSW5FFqjlBn64R6_i6vcSHupUmovI_3IcdrNxlgYdE62fEGbNat2UHT/exec';

const { useState, useEffect, useMemo, useContext, useRef, createContext } = React;
const Ctx = createContext({});
const getApiUrl = () => API_URL || localStorage.getItem('us_api') || '';

/* ---------------- API (tahan server sibuk) ----------------
   - Coba ulang otomatis s.d. 8x (±45 dtk) dengan jeda bertambah + acak (agar
     63 perangkat tidak menyerbu server di detik yang sama).
   - Batas waktu 30 detik per permintaan.
   - Data yang hanya DIBACA disimpan 20 detik di browser, jadi pindah
     menu tidak selalu memanggil server.
------------------------------------------------------------ */
const READ_ACTIONS = ['ping', 'me', 'getSettings', 'getDashboard', 'getTable', 'getPaketList', 'getSoal', 'getCetakData', 'monitor'];
const RETRYABLE = /sibuk|penuh|too many|invoked|timed? ?out|time ?out|exceeded|service error|internal error|temporar|try again|coba lagi sebentar|terlalu lama|tidak bisa terhubung/i;
const _apiCache = new Map();
const sleep = ms => new Promise(r => setTimeout(r, ms));

async function callApi(action, payload = {}, opt = {}) {
  const url = getApiUrl();
  if (!url) throw new Error('URL API belum diatur');
  const isRead = READ_ACTIONS.includes(action);
  const ckey = action + JSON.stringify(payload);
  if (isRead && !opt.fresh) {
    const c = _apiCache.get(ckey);
    if (c && Date.now() - c.t < 20000) return { data: c.data, tries: 0, cached: true };
  }
  if (!isRead && action !== 'ujiBeban') _apiCache.clear();

  const maxTry = opt.retry === false ? 1 : (opt.maxTry || 8);
  let lastErr;
  for (let i = 0; i < maxTry; i++) {
    if (i > 0) {
      if (!opt.silent) window.dispatchEvent(new CustomEvent('api-retry', { detail: { i, max: maxTry - 1 } }));
      // jeda 0,8 → 1,6 → 3,2 → 6,4 → 10 dtk … ditambah acak, total ±45 dtk sebelum menyerah
      await sleep(Math.min(10000, 800 * 2 ** (i - 1)) + Math.random() * 1500 * i);
    }
    let j;
    try {
      const ctl = new AbortController();
      const to = setTimeout(() => ctl.abort(), opt.timeout || 30000);
      const res = await fetch(url, {
        method: 'POST', signal: ctl.signal,
        headers: { 'Content-Type': 'text/plain;charset=utf-8' }, // tanpa CORS preflight
        body: JSON.stringify({ action, token: localStorage.getItem('us_token') || '', ...payload })
      });
      clearTimeout(to);
      const txt = await res.text();
      try { j = JSON.parse(txt); }
      catch (e) {
        // Apps Script yang kewalahan membalas halaman HTML, bukan JSON
        if (res.status >= 429 || /too many|invoked|terlalu banyak|try again|error/i.test(txt)) { lastErr = new Error('Server sedang penuh'); continue; }
        throw new Error('Jawaban server tidak valid. Pastikan URL API benar & web app di-deploy untuk "Siapa saja (Anyone)".');
      }
    } catch (e) {
      if (/tidak valid/.test(e.message)) throw e;
      lastErr = new Error(e.name === 'AbortError' ? 'Server terlalu lama merespons' : 'Tidak bisa terhubung ke server. Periksa internet / URL API.');
      continue;
    }
    if (j.ok) {
      if (!opt.silent) window.dispatchEvent(new Event('api-ok'));
      if (isRead) _apiCache.set(ckey, { t: Date.now(), data: j.data });
      return { data: j.data, tries: i + 1 };
    }
    if (j.error === 'SESI_HABIS') {
      localStorage.removeItem('us_token'); localStorage.removeItem('us_user');
      window.dispatchEvent(new Event('sesi-habis'));
      throw new Error('Sesi habis, silakan login lagi');
    }
    if (RETRYABLE.test(j.error)) { lastErr = new Error(j.error); continue; }
    throw new Error(j.error);
  }
  if (!opt.silent) window.dispatchEvent(new Event('api-ok'));
  throw lastErr || new Error('Server tidak merespons');
}
async function api(action, payload = {}, opt = {}) { return (await callApi(action, payload, opt)).data; }

/* ---------------- Helper ---------------- */
const HARI = ['Minggu', 'Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu'];
const BULAN = ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'];
function fmtTanggal(iso, withDay = true) {
  const m = String(iso || '').match(/^(\d{4})-(\d{2})-(\d{2})/);
  if (!m) return iso || '';
  const d = new Date(+m[1], +m[2] - 1, +m[3]);
  return (withDay ? HARI[d.getDay()] + ', ' : '') + d.getDate() + ' ' + BULAN[d.getMonth()] + ' ' + d.getFullYear();
}
function driveImg(url) {
  url = String(url || '').trim();
  if (!url) return '';
  const m = url.match(/[-\w]{25,}/);
  if (/drive\.google|docs\.google/.test(url) && m) return 'https://lh3.googleusercontent.com/d/' + m[0];
  return url;
}
const ROMAWI = { '10': 'X', '11': 'XI', '12': 'XII' };
const statusBadge = s => ({ 'Belum Ada': 'b-abu', 'Draft': 'b-biru', 'Diajukan': 'b-kuning', 'Dikembalikan': 'b-merah', 'Terkunci': 'b-hijau' }[s] || 'b-abu');
const chunk = (arr, n) => { const o = []; for (let i = 0; i < arr.length; i += n) o.push(arr.slice(i, i + n)); return o; };

function readXlsx(file) {
  return new Promise((res, rej) => {
    const fr = new FileReader();
    fr.onload = e => { try { res(XLSX.read(new Uint8Array(e.target.result), { type: 'array' })); } catch (x) { rej(new Error('File tidak bisa dibaca. Gunakan format .xlsx dari template.')); } };
    fr.onerror = () => rej(new Error('Gagal membaca file'));
    fr.readAsArrayBuffer(file);
  });
}
function sheetRows(wb, prefer, keys) {
  const name = wb.SheetNames.find(n => n.toLowerCase() === prefer.toLowerCase()) || wb.SheetNames[0];
  const rows = XLSX.utils.sheet_to_json(wb.Sheets[name], { defval: '', raw: false });
  return rows.map(r => {
    const o = {};
    Object.keys(r).forEach(k => {
      const kk = keys.find(x => x.toLowerCase() === String(k).trim().toLowerCase());
      if (kk) o[kk] = String(r[k]).trim();
    });
    return o;
  }).filter(o => Object.values(o).some(v => v !== ''));
}

const SOAL_KEYS = ['No', 'Jenis', 'Pertanyaan', 'Gambar', 'A', 'B', 'C', 'D', 'E', 'Kunci', 'Skor'];
function downloadTemplateSoal(kode, nama) {
  const data = [
    SOAL_KEYS,
    [1, 'PG', 'Hasil dari 12 × 3 adalah ....', '', '36', '32', '42', '24', '', 'A', 1],
    [2, 'PGK', 'Manakah yang termasuk bilangan prima? (jawaban bisa lebih dari satu)', '', '2', '4', '5', '9', '11', 'A,C,E', 2],
    [3, 'BS', 'Ibu kota Provinsi Kalimantan Timur adalah Samarinda.', '', '', '', '', '', '', 'B', 1],
    [4, 'ISIAN', 'Hasil dari 15 + 27 = ....', '', '', '', '', '', '', '42|empat puluh dua', 1],
    [5, 'URAIAN', 'Jelaskan langkah-langkah menyelesaikan persamaan 2x + 4 = 10!', '', '', '', '', '', '', 'Rubrik: langkah benar 3, jawaban x=3 benar 2', 5]
  ];
  const ws = XLSX.utils.aoa_to_sheet(data);
  ws['!cols'] = [{ wch: 5 }, { wch: 8 }, { wch: 60 }, { wch: 25 }, { wch: 18 }, { wch: 18 }, { wch: 18 }, { wch: 18 }, { wch: 18 }, { wch: 14 }, { wch: 6 }];
  const petunjuk = XLSX.utils.aoa_to_sheet([
    ['PETUNJUK PENGISIAN SOAL' + (nama ? ' — ' + nama : '')],
    [''],
    ['1. Isi soal di sheet "Soal". Jangan ubah nama kolom di baris pertama. Hapus 5 contoh soal sebelum upload.'],
    ['2. Kolom Jenis diisi salah satu kode berikut:'],
    ['   PG     = Pilihan ganda (1 jawaban benar). Kunci: A / B / C / D / E'],
    ['   PGK    = Pilihan ganda kompleks (lebih dari 1 jawaban). Kunci: A,C,E'],
    ['   BS     = Benar / Salah. Kunci: B (benar) atau S (salah)'],
    ['   ISIAN  = Isian singkat. Kunci: jawaban; jika ada beberapa jawaban benar pisahkan dengan |'],
    ['   URAIAN = Esai, dikoreksi guru. Kolom Kunci boleh diisi rubrik/pedoman'],
    ['3. Kolom Gambar (opsional): link gambar di Google Drive (bagikan "Siapa saja yang memiliki link").'],
    ['4. Kolom Skor: bobot nilai soal. Kosong = 1.'],
    ['5. Soal & kunci bersifat RAHASIA. Jangan bagikan file ini lewat grup WhatsApp.'],
    ['6. Setelah upload, periksa di menu "Lihat", lalu klik "Ajukan" agar diverifikasi admin.']
  ]);
  petunjuk['!cols'] = [{ wch: 100 }];
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Soal');
  XLSX.utils.book_append_sheet(wb, petunjuk, 'Petunjuk');
  XLSX.writeFile(wb, 'Soal_' + (kode || 'MAPEL') + '.xlsx');
}

/* ---------------- Komponen umum ---------------- */
function Modal({ title, onClose, children, wide }) {
  return (
    <div className="modal-bg" onMouseDown={e => { if (e.target === e.currentTarget) onClose(); }}>
      <div className="modal" style={wide ? { maxWidth: 980 } : null}>
        <div className="row" style={{ justifyContent: 'space-between', marginBottom: 8 }}>
          <h3 style={{ margin: 0 }}>{title}</h3>
          <button className="btn sm" onClick={onClose}>✕ Tutup</button>
        </div>
        {children}
      </div>
    </div>
  );
}

function FilePick({ label, onFile, accept = '.xlsx,.xls', className = 'btn', disabled }) {
  const ref = useRef();
  return (
    <>
      <button className={className} disabled={disabled} onClick={() => ref.current.click()}>{label}</button>
      <input ref={ref} type="file" accept={accept} style={{ display: 'none' }}
        onChange={e => { const f = e.target.files[0]; e.target.value = ''; if (f) onFile(f); }} />
    </>
  );
}

/**
 * Tabel yang bisa diedit langsung. columns: [{key,label,width,readOnly,type,options(row)=>[]}]
 */
function TableEditor({ name, columns, reloadKey, rowActions, toolbar, onLoaded }) {
  const { notify } = useContext(Ctx);
  const [rows, setRows] = useState(null);
  const [dirty, setDirty] = useState(false);
  const [busy, setBusy] = useState(false);
  const [q, setQ] = useState('');

  const load = async () => {
    try { const d = await api('getTable', { name }); setRows(d.rows); setDirty(false); onLoaded && onLoaded(d.rows); }
    catch (e) { notify(e.message, 'err'); }
  };
  useEffect(() => { load(); }, [name, reloadKey]);

  const set = (i, k, v) => { setRows(r => { const n = [...r]; n[i] = { ...n[i], [k]: v }; return n; }); setDirty(true); };
  const add = () => { const o = {}; columns.forEach(c => { o[c.key] = c.def || ''; }); setRows(r => [...r, o]); setDirty(true); };
  const del = i => { if (!confirm('Hapus baris ini?')) return; setRows(r => r.filter((_, j) => j !== i)); setDirty(true); };
  const save = async () => {
    setBusy(true);
    try { const d = await api('saveTable', { name, rows }); setRows(d.rows); setDirty(false); onLoaded && onLoaded(d.rows); notify('Data ' + name + ' tersimpan'); }
    catch (e) { notify(e.message, 'err'); }
    finally { setBusy(false); }
  };

  if (!rows) return <div className="card muted">Memuat data {name}…</div>;
  const ql = q.trim().toLowerCase();
  const shown = rows.map((r, i) => ({ r, i })).filter(({ r }) => !ql || Object.values(r).some(v => String(v).toLowerCase().includes(ql)));

  return (
    <div className="card">
      <div className="row" style={{ justifyContent: 'space-between', marginBottom: 10 }}>
        <div className="row">
          <input placeholder="Cari…" value={q} onChange={e => setQ(e.target.value)} style={{ width: 200 }} />
          <span className="muted">{shown.length} dari {rows.length} baris</span>
        </div>
        <div className="row">
          {toolbar}
          <button className="btn" onClick={add}>＋ Tambah baris</button>
          <button className="btn primary" onClick={save} disabled={!dirty || busy}>{busy ? 'Menyimpan…' : dirty ? '💾 Simpan perubahan' : '✓ Tersimpan'}</button>
        </div>
      </div>
      <div className="tablewrap">
        <table className="data">
          <thead><tr><th>#</th>{columns.map(c => <th key={c.key}>{c.label || c.key}</th>)}<th></th></tr></thead>
          <tbody>
            {shown.map(({ r, i }) => (
              <tr key={i}>
                <td className="muted">{i + 1}</td>
                {columns.map(c => {
                  const v = r[c.key] == null ? '' : r[c.key];
                  if (c.readOnly) return <td key={c.key} style={{ minWidth: c.width, fontFamily: c.mono ? 'monospace' : undefined }}>{c.render ? c.render(r) : v}</td>;
                  const opts = typeof c.options === 'function' ? c.options(r) : c.options;
                  if (opts) return (
                    <td key={c.key} style={{ minWidth: c.width }}>
                      <select value={v} onChange={e => set(i, c.key, e.target.value)}>
                        <option value="">—</option>
                        {opts.map(o => typeof o === 'string' ? <option key={o} value={o}>{o}</option> : <option key={o.value} value={o.value}>{o.label}</option>)}
                      </select>
                    </td>
                  );
                  return <td key={c.key} style={{ minWidth: c.width }}><input type={c.type || 'text'} value={v} onChange={e => set(i, c.key, e.target.value)} /></td>;
                })}
                <td style={{ whiteSpace: 'nowrap' }}>
                  {rowActions && rowActions(r, dirty)}
                  <button className="btn sm danger" onClick={() => del(i)} title="Hapus">🗑</button>
                </td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>
      {dirty && <p className="hint" style={{ color: 'var(--kuning)' }}>⚠ Ada perubahan yang belum disimpan.</p>}
    </div>
  );
}

function Login({ onLogin }) {
  const [u, setU] = useState('');
  const [p, setP] = useState('');
  const [url, setUrl] = useState(getApiUrl());
  const [busy, setBusy] = useState(false);
  const [err, setErr] = useState('');
  const submit = async e => {
    e.preventDefault(); setErr('');
    if (!API_URL) localStorage.setItem('us_api', url.trim());
    setBusy(true);
    try {
      const r = await api('login', { username: u, password: p });
      localStorage.setItem('us_token', r.token);
      localStorage.setItem('us_user', JSON.stringify(r.user));
      onLogin(r.user);
    } catch (x) { setErr(x.message); }
    finally { setBusy(false); }
  };
  return (
    <div className="login-wrap">
      <form className="card login" onSubmit={submit}>

        <p className="muted" style={{ marginTop: 0 }}>Panel Admin & Guru</p>

}

  );

      <TableEditor name="Mapel" columns={cols} />

/* ---------------- Jadwal ---------------- */
const TK = ['10', '11', '12'];
const menit = (a, b) => { const p = s => { const m = String(s || '').match(/(\d{1,2}):(\d{2})/); return m ? +m[1] * 60 + +m[2] : NaN; }; return p(b) - p(a); };
const addDays = (iso, n) => { const [y, m, d] = iso.split('-').map(Number); const x = new Date(y, m - 1, d + n); return x.getFullYear() + '-' + String(x.getMonth() + 1).padStart(2, '0') + '-' + String(x.getDate()).padStart(2, '0'); };
const dayOf = iso => { const [y, m, d] = iso.split('-').map(Number); return new Date(y, m - 1, d).getDay(); };

/** Kelompokkan baris Jadwal (1 baris per tingkat) menjadi slot (1 baris per jam ujian). */
function jadwalToSlots(rows) {
  const map = {};
  rows.forEach(r => {
    const k = [r.Tanggal, r.JamMulai, r.JamSelesai, r.Sesi || '1'].join('|');
    if (!map[k]) map[k] = { uid: k + Math.random(), Tanggal: r.Tanggal, JamMulai: r.JamMulai, JamSelesai: r.JamSelesai, Sesi: r.Sesi || '1', cell: {} };
    map[k].cell[r.Tingkat] = { ID: r.ID, KodeMapel: r.KodeMapel };
  });
  return Object.values(map).sort((a, b) => (a.Tanggal + a.JamMulai + a.Sesi).localeCompare(b.Tanggal + b.JamMulai + b.Sesi));
}
function slotsToRows(slots) {
  const rows = [];
  slots.forEach(s => TK.forEach(t => {
    const c = s.cell[t];
    if (c && c.KodeMapel) rows.push({ ID: c.ID || '', Tanggal: s.Tanggal, Sesi: s.Sesi || '1', JamMulai: s.JamMulai, JamSelesai: s.JamSelesai, Tingkat: t, KodeMapel: c.KodeMapel, Durasi: String(Math.max(0, menit(s.JamMulai, s.JamSelesai)) || '') });
  }));
  return rows;
}
/** Nomor jam ke- per tanggal */
function jamKe(slots) {
  const o = {}; const cnt = {};
  slots.forEach(s => { const k = s.Tanggal + '|' + s.JamMulai; if (!(k in o)) { cnt[s.Tanggal] = (cnt[s.Tanggal] || 0) + 1; o[k] = cnt[s.Tanggal]; } });
  return s => o[s.Tanggal + '|' + s.JamMulai];
}

function JadwalPage() {
  const { notify } = useContext(Ctx);
  const [mapel, setMapel] = useState([]);
  const [slots, setSlots] = useState(null);
  const [st, setSt] = useState({});
  const [dirty, setDirty] = useState(false);
  const [busy, setBusy] = useState(false);
  const [view, setView] = useState('edit');
  const [gen, setGen] = useState({ mulai: '', jam: '07:30-09:00\n09:30-11:00\n11:15-12:45', sabtu: false });

  const load = async () => {
    try {
      const [m, j, s] = await Promise.all([api('getTable', { name: 'Mapel' }), api('getTable', { name: 'Jadwal' }), api('getSettings')]);
      setMapel(m.rows.sort((a, b) => Number(a.Urut || 0) - Number(b.Urut || 0)));
      setSlots(jadwalToSlots(j.rows)); setSt(s); setDirty(false);
    } catch (e) { notify(e.message, 'err'); }
  };
  useEffect(() => { load(); }, []);
  if (!slots) return <div className="card muted">Memuat jadwal…</div>;

  const namaMapel = Object.fromEntries(mapel.map(m => [m.Kode, m.Nama]));
  const upd = (i, f) => { setSlots(s => { const n = [...s]; n[i] = f({ ...n[i], cell: { ...n[i].cell } }); return n; }); setDirty(true); };
  const setCell = (i, t, v) => upd(i, s => { s.cell[t] = { ...(s.cell[t] || {}), KodeMapel: v }; return s; });
  const tambah = () => {
    const last = slots[slots.length - 1];
    setSlots([...slots, { uid: Math.random(), Tanggal: last ? last.Tanggal : '', JamMulai: '', JamSelesai: '', Sesi: '1', cell: {} }]); setDirty(true);
  };
  const hapus = i => { if (!confirm('Hapus jam ujian ini (untuk semua kelas)?')) return; setSlots(slots.filter((_, j) => j !== i)); setDirty(true); };

  // Rekap & pemeriksaan
  const dipakai = {}; TK.forEach(t => { dipakai[t] = {}; });
  slots.forEach((s, i) => TK.forEach(t => { const k = s.cell[t] && s.cell[t].KodeMapel; if (k) (dipakai[t][k] = dipakai[t][k] || []).push(i); }));
  const masalah = [];
  slots.forEach((s, i) => {
    const n = 'Baris ' + (i + 1) + ': ';
    if (!s.Tanggal) masalah.push(n + 'tanggal belum diisi');
    if (!s.JamMulai || !s.JamSelesai) masalah.push(n + 'jam belum lengkap');
    else if (!(menit(s.JamMulai, s.JamSelesai) > 0)) masalah.push(n + 'jam selesai harus setelah jam mulai');
    if (s.Tanggal && dayOf(s.Tanggal) === 0) masalah.push(n + 'tanggal jatuh pada hari Minggu');
    slots.forEach((o, j) => {
      if (j > i && o.Tanggal === s.Tanggal && o.Sesi === s.Sesi && s.JamMulai && o.JamMulai && menit(o.JamMulai, s.JamSelesai) > 0 && menit(s.JamMulai, o.JamSelesai) > 0)
        masalah.push(`Baris ${i + 1} & ${j + 1}: jam bertabrakan pada tanggal yang sama`);
    });
  });
  TK.forEach(t => Object.entries(dipakai[t]).forEach(([k, idx]) => { if (idx.length > 1) masalah.push(`Kelas ${t}: ${namaMapel[k] || k} terjadwal ${idx.length}× (baris ${idx.map(x => x + 1).join(', ')})`); }));
  const belum = t => mapel.filter(m => m.Tingkat === t && !dipakai[t][m.Kode]);

  const simpan = async () => {
    if (masalah.some(m => /belum|harus|bertabrakan/.test(m)) && !confirm('Masih ada masalah pada jadwal:\n\n' + masalah.slice(0, 10).join('\n') + '\n\nTetap simpan?')) return;
    setBusy(true);
    try { await api('saveTable', { name: 'Jadwal', rows: slotsToRows(slots) }); notify('Jadwal tersimpan. Daftar hadir otomatis mengikuti.'); await load(); }
    catch (e) { notify(e.message, 'err'); }
    finally { setBusy(false); }
  };

  const buatKerangka = () => {
    const jam = gen.jam.split('\n').map(x => x.trim()).filter(Boolean).map(x => x.split(/\s*[-–]\s*/));
    if (!gen.mulai) return notify('Isi tanggal mulai', 'err');
    if (!jam.length || jam.some(j => j.length !== 2 || !(menit(j[0], j[1]) > 0))) return notify('Format jam salah. Contoh: 07:30-09:00 (satu baris satu jam)', 'err');
    const perHari = jam.length;
    const maks = Math.max(...TK.map(t => mapel.filter(m => m.Tingkat === t).length));
    const jumlahHari = Math.ceil(maks / perHari);
    if (slots.length && !confirm('Jadwal yang ada akan DIGANTI dengan kerangka baru. Lanjutkan?')) return;
    const baru = []; let d = gen.mulai; let hari = 0;
    while (hari < jumlahHari) {
      const w = dayOf(d);
      if (w !== 0 && (gen.sabtu || w !== 6)) { jam.forEach(([a, b]) => baru.push({ uid: Math.random(), Tanggal: d, JamMulai: a.padStart(5, '0'), JamSelesai: b.padStart(5, '0'), Sesi: '1', cell: {} })); hari++; }
      d = addDays(d, 1);
    }
    // isi mapel berurutan (urutan menu Mapel)
    TK.forEach(t => mapel.filter(m => m.Tingkat === t).forEach((m, k) => { if (baru[k]) baru[k].cell[t] = { KodeMapel: m.Kode }; }));
    setSlots(baru); setDirty(true);
    notify(`Kerangka ${jumlahHari} hari × ${perHari} jam dibuat & mapel diisi berurutan. Silakan sesuaikan lalu Simpan.`);
  };

  const ke = jamKe(slots);

  if (view === 'cetak') {
    const tanggal = [...new Set(slots.map(s => s.Tanggal))];
    return (
      <>
        <div className="card no-print row">
          <button className="btn" onClick={() => setView('edit')}>← Kembali</button>
          <button className="btn primary" onClick={() => window.print()}>🖨 Cetak jadwal</button>
          {dirty && <span style={{ color: 'var(--kuning)' }}>⚠ Ada perubahan belum disimpan</span>}
        </div>
        <div className="page">
          <Kop s={st} />
          <p className="judul-cetak">JADWAL {st.nama_ujian}</p>
          <p className="sub-cetak">TAHUN PELAJARAN {st.tahun_pelajaran}</p>
          <table className="dh">
            <thead><tr><th style={{ width: '8mm' }}>No</th><th style={{ width: '38mm' }}>Hari / Tanggal</th><th style={{ width: '12mm' }}>Jam ke</th><th style={{ width: '26mm' }}>Waktu</th><th>Kelas X</th><th>Kelas XI</th><th>Kelas XII</th></tr></thead>
            <tbody>
              {tanggal.map((t, ti) => {
                const ss = slots.filter(s => s.Tanggal === t);
                return ss.map((s, k) => (
                  <tr key={s.uid}>
                    {k === 0 && <td rowSpan={ss.length} style={{ textAlign: 'center' }}>{ti + 1}</td>}
                    {k === 0 && <td rowSpan={ss.length}>{fmtTanggal(t)}</td>}
                    <td style={{ textAlign: 'center' }}>{ke(s)}</td>
                    <td style={{ textAlign: 'center' }}>{s.JamMulai} – {s.JamSelesai}</td>
                    {TK.map(x => <td key={x}>{namaMapel[s.cell[x] && s.cell[x].KodeMapel] || '–'}</td>)}
                  </tr>
                ));
              })}
            </tbody>
          </table>
          <p style={{ fontSize: '9pt' }}>Waktu dalam WITA. Peserta hadir 15 menit sebelum ulangan dimulai dan wajib membawa kartu peserta.</p>
          <div className="dh-foot"><div /><div style={{ textAlign: 'center', minWidth: '65mm' }}>{st.kota}, ......................<br />Kepala Sekolah,<div className="sp" /><b><u>{st.kepala_sekolah}</u></b><br />NIP. {st.nip_kepsek}</div></div>
        </div>
      </>
    );
  }

  return (
    <>
      <div className="card">
        <h3 style={{ marginTop: 0 }}>Buat kerangka jadwal otomatis <span className="hint">(opsional)</span></h3>
        <div className="row" style={{ alignItems: 'flex-start' }}>
          <label style={{ margin: 0 }}>Tanggal mulai<input type="date" value={gen.mulai} onChange={e => setGen({ ...gen, mulai: e.target.value })} style={{ width: 170 }} /></label>
          <label style={{ margin: 0 }}>Jam ujian per hari (1 baris = 1 jam)<textarea rows="3" value={gen.jam} onChange={e => setGen({ ...gen, jam: e.target.value })} style={{ width: 170 }} /></label>
          <div>
            <label style={{ display: 'flex', gap: 6, alignItems: 'center' }}><input type="checkbox" checked={gen.sabtu} onChange={e => setGen({ ...gen, sabtu: e.target.checked })} style={{ width: 'auto' }} /> Sabtu ikut ujian</label>
            <button className="btn" onClick={buatKerangka}>⚡ Buat kerangka</button>
          </div>
        </div>
        <p className="hint" style={{ marginBottom: 0 }}>Hari Minggu otomatis dilewati. Mapel diisi berurutan sesuai menu Mapel. Setelah itu tinggal tukar mapel lewat pilihan di tabel. 18 mapel ÷ 3 jam = 6 hari.</p>
      </div>

      <div className="card">
        <div className="row" style={{ justifyContent: 'space-between', marginBottom: 10 }}>
          <span className="muted">{slots.length} jam ujian · {new Set(slots.map(s => s.Tanggal)).size} hari</span>
          <div className="row">
            <button className="btn" onClick={() => setView('cetak')}>🖨 Lihat / cetak jadwal</button>
            <button className="btn" onClick={tambah}>＋ Tambah jam ujian</button>
            <button className="btn primary" onClick={simpan} disabled={!dirty || busy}>{busy ? 'Menyimpan…' : dirty ? '💾 Simpan jadwal' : '✓ Tersimpan'}</button>
          </div>
        </div>
        <div className="tablewrap">
          <table className="data">
            <thead><tr><th>#</th><th>Tanggal</th><th>Jam ke</th><th>Mulai</th><th>Selesai</th>{st.jumlah_sesi > 1 && <th>Sesi</th>}<th>Kelas X</th><th>Kelas XI</th><th>Kelas XII</th><th></th></tr></thead>
            <tbody>
              {slots.map((s, i) => (
                <tr key={s.uid} style={i > 0 && slots[i - 1].Tanggal !== s.Tanggal ? { borderTop: '3px solid #cbd5e1' } : null}>
                  <td className="muted">{i + 1}</td>
                  <td style={{ minWidth: 150 }}>
                    <input type="date" value={s.Tanggal} onChange={e => upd(i, x => ({ ...x, Tanggal: e.target.value }))} />
                    <div className="hint">{s.Tanggal ? HARI[dayOf(s.Tanggal)] : ''}</div>
                  </td>
                  <td style={{ textAlign: 'center' }}>{s.Tanggal && s.JamMulai ? ke(s) : ''}</td>
                  <td style={{ minWidth: 100 }}><input type="time" value={s.JamMulai} onChange={e => upd(i, x => ({ ...x, JamMulai: e.target.value }))} /></td>
                  <td style={{ minWidth: 100 }}><input type="time" value={s.JamSelesai} onChange={e => upd(i, x => ({ ...x, JamSelesai: e.target.value }))} /><div className="hint">{menit(s.JamMulai, s.JamSelesai) > 0 ? menit(s.JamMulai, s.JamSelesai) + ' menit' : ''}</div></td>
                  {st.jumlah_sesi > 1 && <td style={{ minWidth: 60 }}><input value={s.Sesi} onChange={e => upd(i, x => ({ ...x, Sesi: e.target.value }))} /></td>}
                  {TK.map(t => {
                    const v = (s.cell[t] && s.cell[t].KodeMapel) || '';
                    const ganda = v && dipakai[t][v] && dipakai[t][v].length > 1;
                    return (
                      <td key={t} style={{ minWidth: 190 }}>
                        <select value={v} onChange={e => setCell(i, t, e.target.value)} style={ganda ? { borderColor: 'var(--merah)', background: '#fef2f2' } : null}>
                          <option value="">— kosong —</option>
                          {mapel.filter(m => m.Tingkat === t).map(m => <option key={m.Kode} value={m.Kode}>{m.Nama}{dipakai[t][m.Kode] && m.Kode !== v ? ' ✓' : ''}</option>)}
                        </select>
                      </td>
                    );
                  })}
                  <td><button className="btn sm danger" onClick={() => hapus(i)}>🗑</button></td>
                </tr>
              ))}
              {!slots.length && <tr><td colSpan="10" className="muted" style={{ padding: 16 }}>Belum ada jadwal. Gunakan "Buat kerangka" atau "Tambah jam ujian".</td></tr>}
            </tbody>
          </table>
        </div>
        <p className="hint">Tanda ✓ di pilihan = mapel sudah terjadwal di jam lain. Kotak merah = mapel terjadwal dua kali.</p>
        {dirty && <p className="hint" style={{ color: 'var(--kuning)' }}>⚠ Ada perubahan yang belum disimpan.</p>}
      </div>

      <div className="grid stats">
        {TK.map(t => {
          const total = mapel.filter(m => m.Tingkat === t).length; const b = belum(t);
          return (
            <div className="stat" key={t}>
              <span className="muted">Kelas {ROMAWI[t]}</span>
              <b style={{ color: b.length ? 'var(--kuning)' : 'var(--hijau)' }}>{total - b.length} / {total}</b>
              <span className="hint">{b.length ? 'Belum terjadwal: ' + b.map(m => m.Nama).join(', ') : '✓ Semua mapel terjadwal'}</span>
            </div>
          );
        })}
      </div>
      {masalah.length > 0 && <div className="card" style={{ marginTop: 16 }}><b>Periksa:</b><ul style={{ margin: '6px 0 0' }}>{masalah.map((m, i) => <li key={i}>{m}</li>)}</ul></div>}
    </>
  );
}

/* ---------------- Bank Soal ---------------- */
function SoalPage({ user }) {
  const { notify } = useContext(Ctx);
  const isAdmin = user.peran === 'admin';
  const [list, setList] = useState(null);
  const [fTingkat, setFTingkat] = useState('');
  const [fStatus, setFStatus] = useState('');
  const [preview, setPreview] = useState(null);
  const [busy, setBusy] = useState('');
  const [uploadErr, setUploadErr] = useState(null);

  const load = () => api('getPaketList').then(setList).catch(e => notify(e.message, 'err'));
  useEffect(() => { load(); }, []);

  const upload = async (p, f) => {
    try {
      const wb = await readXlsx(f);
      const rows = sheetRows(wb, 'Soal', SOAL_KEYS);
      if (!rows.length) throw new Error('Sheet "Soal" kosong');
      if (!confirm(`Upload ${rows.length} soal untuk ${p.NamaMapel} kelas ${p.Tingkat}?\nSoal lama pada paket ini akan diganti.`)) return;
      setBusy(p.KodeMapel);
      const r = await api('uploadSoal', { kodeMapel: p.KodeMapel, rows });
      notify(`✓ ${r.jumlah} soal tersimpan (total skor ${r.totalSkor})`);
      load();
    } catch (e) { setUploadErr({ mapel: p.NamaMapel + ' ' + p.Tingkat, msg: e.message }); }
    finally { setBusy(''); }
  };
  const lihat = async p => {
    setBusy(p.KodeMapel);
    try { const d = await api('getSoal', { kodeMapel: p.KodeMapel }); setPreview({ p, ...d }); }
    catch (e) { notify(e.message, 'err'); }
    finally { setBusy(''); }
  };
  const status = async (p, s) => {
    let catatan = '';
    if (s === 'Dikembalikan') { catatan = prompt('Alasan dikembalikan ke guru:'); if (!catatan) return; }
    else if (!confirm(`Ubah status ${p.NamaMapel} ${p.Tingkat} menjadi "${s}"?`)) return;
    setBusy(p.KodeMapel);
    try { await api('setStatusPaket', { kodeMapel: p.KodeMapel, status: s, catatan }); notify('Status: ' + s); load(); setPreview(null); }
    catch (e) { notify(e.message, 'err'); }
    finally { setBusy(''); }
  };

  if (!list) return <div className="card muted">Memuat paket soal…</div>;
  const shown = list.filter(p => (!fTingkat || p.Tingkat === fTingkat) && (!fStatus || p.Status === fStatus));

  const aksi = p => {
    const b = busy === p.KodeMapel;
    const s = p.Status;
    const bisaUpload = isAdmin ? s !== 'Terkunci' : ['Belum Ada', 'Draft', 'Dikembalikan'].includes(s);
    const ada = Number(p.JumlahSoal) > 0;
    return (
      <div className="row" style={{ gap: 4 }}>
        {bisaUpload && <FilePick label="⬆ Upload" className="btn sm primary" disabled={b} onFile={f => upload(p, f)} />}
        <button className="btn sm" onClick={() => downloadTemplateSoal(p.KodeMapel, p.NamaMapel + ' ' + p.Tingkat)} title="Template">⬇</button>
        {ada && <button className="btn sm" disabled={b} onClick={() => lihat(p)}>👁 Lihat</button>}
        {!isAdmin && ada && (s === 'Draft' || s === 'Dikembalikan') && <button className="btn sm success" disabled={b} onClick={() => status(p, 'Diajukan')}>Ajukan</button>}
        {!isAdmin && s === 'Diajukan' && <button className="btn sm" disabled={b} onClick={() => status(p, 'Draft')}>Tarik</button>}
        {isAdmin && ada && s !== 'Terkunci' && <button className="btn sm success" disabled={b} onClick={() => status(p, 'Terkunci')}>🔒 Kunci</button>}
        {isAdmin && ada && (s === 'Diajukan' || s === 'Draft') && <button className="btn sm danger" disabled={b} onClick={() => status(p, 'Dikembalikan')}>Kembalikan</button>}
        {isAdmin && s === 'Terkunci' && <button className="btn sm" disabled={b} onClick={() => status(p, 'Draft')}>Buka kunci</button>}
      </div>
    );
  };

  return (
    <>
      <div className="card">
        <div className="row" style={{ justifyContent: 'space-between' }}>
          <div className="row">
            <select value={fTingkat} onChange={e => setFTingkat(e.target.value)} style={{ width: 140 }}>
              <option value="">Semua tingkat</option><option value="10">Kelas 10</option><option value="11">Kelas 11</option><option value="12">Kelas 12</option>
            </select>
            <select value={fStatus} onChange={e => setFStatus(e.target.value)} style={{ width: 160 }}>
              <option value="">Semua status</option>{['Belum Ada', 'Draft', 'Diajukan', 'Dikembalikan', 'Terkunci'].map(s => <option key={s}>{s}</option>)}
            </select>
            <span className="muted">{shown.length} paket</span>
          </div>
          <button className="btn" onClick={() => downloadTemplateSoal('', '')}>⬇ Template soal</button>
        </div>
        <p className="hint" style={{ marginBottom: 0 }}>
          Alur: <span className="badge b-abu">Belum Ada</span> → upload → <span className="badge b-biru">Draft</span> → guru ajukan → <span className="badge b-kuning">Diajukan</span> → admin periksa → <span className="badge b-hijau">Terkunci</span> (siap dipakai, tidak bisa diubah).
        </p>
      </div>
      {!isAdmin && list.length === 0 && <div className="card">Belum ada mapel yang ditugaskan kepada Anda. Hubungi admin.</div>}
      <div className="card" style={{ padding: 0 }}>
        <div className="tablewrap" style={{ border: 0 }}>
          <table className="data">
            <thead><tr><th>Mapel</th><th>Kls</th>{isAdmin && <th>Guru</th>}<th>Soal</th><th>Skor</th><th>Status</th><th>Catatan</th><th>Aksi</th></tr></thead>
            <tbody>
              {shown.map(p => (
                <tr key={p.KodeMapel}>
                  <td><b>{p.NamaMapel}</b><div className="hint">{p.KodeMapel}</div></td>
                  <td>{p.Tingkat}</td>
                  {isAdmin && <td>{p.NamaGuru || <span className="badge b-merah">Belum ada</span>}</td>}
                  <td>{p.JumlahSoal}</td>
                  <td>{p.TotalSkor}</td>

/** Kecilkan foto di browser: 240×320 (3:4) dipotong tengah, JPEG < 45 KB. */
function kompresFoto(file) {
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      const W = 240, H = 320, c = document.createElement('canvas');
      c.width = W; c.height = H;
      const ctx = c.getContext('2d');
      ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, W, H);
      const r = Math.max(W / img.width, H / img.height), w = img.width * r, h = img.height * r;
      ctx.drawImage(img, (W - w) / 2, (H - h) * 0.35, w, h);
      let q = 0.82, d = c.toDataURL('image/jpeg', q);
      while (d.length > 45000 && q > 0.3) { q -= 0.08; d = c.toDataURL('image/jpeg', q); }
      URL.revokeObjectURL(url);
      res(d);
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error(file.name + ': bukan gambar JPG/PNG (foto HEIC iPhone harus diubah ke JPG dulu)')); };
    img.src = url;
  });
}
const normNama = x => String(x || '').toLowerCase().replace(/\.[a-z0-9]+$/, '').replace(/[_\-.]+/g, ' ').replace(/\s+/g, ' ').trim();

function FotoPage() {
  const { notify } = useContext(Ctx);
  const [siswa, setSiswa] = useState(null);
  const [foto, setFoto] = useState({});

  const [hasil, setHasil] = useState(null);
  const ref1 = useRef(); const target = useRef(null);
  const load = async () => {
    try {
      const [s, f] = await Promise.all([api('getTable', { name: 'Siswa' }), api('getFoto', {}, { fresh: true })]);
      setSiswa(s.rows.filter(x => x.Status !== 'Nonaktif')); setFoto(f);
    } catch (e) { notify(e.message, 'err'); }
  };
  useEffect(() => { load(); }, []);

  const kirim = async items => {
    for (let i = 0; i < items.length; i += 8) {
      setProg({ n: Math.min(i + 8, items.length), total: items.length });
      await api('uploadFoto', { items: items.slice(i, i + 8) });
      setFoto(f => { const n = { ...f }; items.slice(i, i + 8).forEach(it => { n[it.kunci] = it.data; }); return n; });
    }
    setProg(null);
  };
  const cocokkan = f => {
    const stem = normNama(f.name), digits = stem.replace(/\s/g, '');
    return siswa.find(s => (s.NISN && String(s.NISN).trim() === digits) || s.Username === digits || String(s.NoPeserta).replace('-', '') === digits.replace('-', '') || normNama(s.Nama) === stem);
  };
  const unggahBanyak = async files => {
    const cocok = [], gagal = [];
    for (const f of files) {
      const s = cocokkan(f);
      if (!s) { gagal.push(f.name + ' — tidak ada siswa yang cocok'); continue; }
      try { cocok.push({ kunci: fotoKey(s), no: s.NoPeserta, nama: s.Nama, data: await kompresFoto(f) }); }
      catch (e) { gagal.push(e.message); }
    }
    try { if (cocok.length) await kirim(cocok); setHasil({ ok: cocok.length, gagal }); }
    catch (e) { setProg(null); notify(e.message, 'err'); }
  };
  const unggahSatu = async (s, f) => {
    try { await kirim([{ kunci: fotoKey(s), no: s.NoPeserta, nama: s.Nama, data: await kompresFoto(f) }]); notify('Foto tersimpan: ' + s.Nama); }
    catch (e) { setProg(null); notify(e.message, 'err'); }

  const hapus = async s => {
    if (!confirm('Hapus foto ' + s.Nama + '?')) return;
    try { await api('hapusFoto', { kunci: fotoKey(s) }); setFoto(f => { const n = { ...f }; delete n[fotoKey(s)]; return n; }); }
    catch (e) { notify(e.message, 'err'); }

  const ruang = [...new Set(siswa.map(s => s.Ruang))].filter(Boolean).sort();
  const shown = siswa.filter(s => (!fR || s.Ruang === fR) && (!q || (s.Nama + s.NoPeserta + s.NISN).toLowerCase().includes(q.toLowerCase())))
    .sort((a, b) => a.NoPeserta.localeCompare(b.NoPeserta));
  const ada = siswa.filter(s => foto[fotoKey(s)]).length;

  return (
    <>
      <div className="card">
        <div className="row" style={{ justifyContent: 'space-between' }}>
          <div className="row">
            <button className="btn primary" disabled={!!prog} onClick={() => ref1.current.click()}>⬆ Unggah banyak foto sekaligus</button>
            <input ref={ref1} type="file" accept="image/*" multiple style={{ display: 'none' }} onChange={e => { const f = [...e.target.files]; e.target.value = ''; if (f.length) unggahBanyak(f); }} />
            {prog && <span className="muted">Mengunggah {prog.n}/{prog.total}…</span>}
          </div>
          <span className={'badge ' + (ada === siswa.length ? 'b-hijau' : 'b-kuning')}>{ada} / {siswa.length} siswa sudah berfoto</span>
        </div>
        <p className="hint" style={{ marginBottom: 0 }}>
          <b>Unggah banyak:</b> beri nama setiap file foto dengan <b>NISN</b> (mis. <code>0081234567.jpg</code>), nomor peserta (<code>10-001.jpg</code>), atau <b>nama lengkap</b> siswa (<code>Ahmad Fauzi.jpg</code>), lalu pilih semua file sekaligus. Foto otomatis dipotong ukuran 3×4 dan dikecilkan.
          Atau klik kotak foto di bawah untuk mengunggah satu per satu (bisa langsung dari kamera HP). Foto tersimpan berdasarkan NISN, jadi tetap aman walau nomor peserta dibuat ulang.
        </p>
      </div>
      <div className="card">
        <div className="row" style={{ marginBottom: 12 }}>
          <select value={fR} onChange={e => setFR(e.target.value)} style={{ width: 160 }}><option value="">Semua ruang</option>{ruang.map(r => <option key={r}>{r}</option>)}</select>
          <input placeholder="Cari nama / no. peserta" value={q} onChange={e => setQ(e.target.value)} style={{ width: 220 }} />
          <span className="muted">{shown.filter(s => !foto[fotoKey(s)]).length} belum berfoto</span>
        </div>
        <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fill,minmax(130px,1fr))', gap: 12 }}>
          {shown.map(s => {
            const src = foto[fotoKey(s)];
            return (
              <div key={s.NoPeserta} style={{ border: '1px solid var(--garis)', borderRadius: 10, padding: 8, textAlign: 'center' }}>
                <div onClick={() => { target.current = s; document.getElementById('foto1').click(); }} title="Klik untuk unggah / ganti foto"
                  style={{ width: 90, height: 120, margin: '0 auto 6px', borderRadius: 6, cursor: 'pointer', background: src ? `center/cover url(${src})` : '#f1f5f9', border: src ? '1px solid #cbd5e1' : '2px dashed #cbd5e1', display: 'flex', alignItems: 'center', justifyContent: 'center', color: 'var(--muted)', fontSize: 12 }}>

        </Modal>

    </>
  );

/** Alamat halaman ujian siswa (dibuat di Tahap 2) + username, untuk QR di kartu. */
function linkSiswa(username) {
  const base = location.href.split('#')[0].split('?')[0].replace(/[^/]*$/, '');
  return base + 'siswa.html?u=' + encodeURIComponent(username);
}

function QR({ text }) {
  const src = useMemo(() => { try { const q = qrcode(0, 'M'); q.addData(String(text)); q.make(); return q.createDataURL(4, 0); } catch (e) { return ''; } }, [text]);
  return src ? <img className="qr" src={src} alt="QR" /> : null;
}

function terbilang(n) {
  const a = ['', 'satu', 'dua', 'tiga', 'empat', 'lima', 'enam', 'tujuh', 'delapan', 'sembilan', 'sepuluh', 'sebelas'];
  n = Math.floor(Number(n) || 0);
  if (n < 12) return a[n];
  if (n < 20) return terbilang(n - 10) + ' belas';
  if (n < 100) return terbilang(Math.floor(n / 10)) + ' puluh' + (n % 10 ? ' ' + terbilang(n % 10) : '');
  if (n < 200) return 'seratus' + (n - 100 ? ' ' + terbilang(n - 100) : '');
  if (n < 1000) return terbilang(Math.floor(n / 100)) + ' ratus' + (n % 100 ? ' ' + terbilang(n % 100) : '');
  if (n < 2000) return 'seribu' + (n - 1000 ? ' ' + terbilang(n - 1000) : '');
  return terbilang(Math.floor(n / 1000)) + ' ribu' + (n % 1000 ? ' ' + terbilang(n % 1000) : '');
}

function DaftarHadirPage({ awal = 'hadir' }) {
  const d = useCetakData();
  const [jenis, setJenis] = useState(awal);
  const [tgl, setTgl] = useState('');
  const [jam, setJam] = useState('');
  const [kls, setKls] = useState('');
  if (!d) return <div className="card muted">Memuat data cetak…</div>;
  const s = d.settings;
  const mapel = Object.fromEntries(d.mapel.map(m => [m.Kode, m.Nama]));
  const tanggalList = [...new Set(d.jadwal.map(j => j.Tanggal))].sort();
  const ke = jamKe(jadwalToSlots(d.jadwal));
  const jamList = [...new Set(d.jadwal.filter(j => j.Tanggal === tgl).map(j => j.JamMulai + '–' + j.JamSelesai))].sort();
  const jadwal = d.jadwal.filter(j => (!tgl || j.Tanggal === tgl) && (!tgl || !jam || j.JamMulai + '–' + j.JamSelesai === jam) && (!kls || j.Tingkat === kls))
    .sort((a, b) => (a.Tanggal + a.Sesi + a.JamMulai + a.Tingkat).localeCompare(b.Tanggal + b.Sesi + b.JamMulai + b.Tingkat));
  const ruang = [...d.ruang].sort((a, b) => a.Kode.localeCompare(b.Kode));

  // satu lembar = satu jadwal (mapel+tingkat) × satu ruang
  const lembar = [];
  jadwal.forEach(j => ruang.forEach(r => {
    const peserta = d.siswa.filter(x => x.Tingkat === j.Tingkat && x.Ruang === r.Kode && String(x.Sesi) === String(j.Sesi))
      .sort((a, b) => a.NoPeserta.localeCompare(b.NoPeserta));
    if (peserta.length) lembar.push({ j, r, peserta });
  }));
  lembar.sort((a, b) => (a.j.Tanggal + a.j.JamMulai + a.j.Sesi + a.r.Kode).localeCompare(b.j.Tanggal + b.j.JamMulai + b.j.Sesi + b.r.Kode));

  return (
    <>
      <div className="card no-print">
        <div className="row">
          <select value={tgl} onChange={e => { setTgl(e.target.value); setJam(''); }} style={{ width: 240 }}>
            <option value="">Semua tanggal</option>
            {tanggalList.map(t => <option key={t} value={t}>{fmtTanggal(t)}</option>)}
          </select>
          {tgl && <select value={jam} onChange={e => setJam(e.target.value)} style={{ width: 200 }}>
            <option value="">Semua jam</option>
            {jamList.map((j, i) => <option key={j} value={j}>Jam ke-{i + 1} ({j})</option>)}
          </select>}
          <select value={kls} onChange={e => setKls(e.target.value)} style={{ width: 150 }}>
            <option value="">Semua kelas</option>{TK.map(t => <option key={t} value={t}>Kelas {ROMAWI[t]}</option>)}
          </select>
          <select value={jenis} onChange={e => setJenis(e.target.value)} style={{ width: 250 }}>
            <option value="hadir">Daftar Hadir</option>
            <option value="ba">Berita Acara</option>
            <option value="dua">Daftar Hadir + Berita Acara</option>
          </select>
          <button className="btn primary" onClick={() => window.print()} disabled={!lembar.length}>🖨 Cetak {jenis === 'dua' ? lembar.length * 2 : lembar.length} lembar</button>
        </div>
        <p className="hint" style={{ marginBottom: 0 }}>Data diambil langsung dari menu <b>Jadwal</b> — jika jadwal diubah, daftar hadir ikut berubah. Satu lembar per ruang per mapel. Pilihan "Daftar Hadir + Berita Acara" mencetak keduanya berurutan per ruang, jadi siap dimasukkan ke amplop pengawas. Jika lembar kosong, periksa menu Jadwal & pembagian ruang siswa.</p>
      </div>
      {!lembar.length && <div className="card">Belum ada daftar hadir. Pastikan jadwal sudah diisi dan siswa sudah dibagi ruang.</div>}
      {lembar.map(({ j, r, peserta }, i) => (
        <React.Fragment key={i}>
        {jenis !== 'ba' && <div className="page">
          <Kop s={s} />
          <p className="judul-cetak">DAFTAR HADIR PESERTA</p>
          <p className="sub-cetak">{s.nama_ujian} TAHUN PELAJARAN {s.tahun_pelajaran}</p>
          <table className="info-cetak"><tbody>
            <tr><td>Hari / Tanggal</td><td>: {fmtTanggal(j.Tanggal)}</td><td style={{ paddingLeft: '12mm' }}>Ruang</td><td>: {r.Nama}</td></tr>
            <tr><td>Mata Pelajaran</td><td>: <b>{mapel[j.KodeMapel] || j.KodeMapel}</b></td><td style={{ paddingLeft: '12mm' }}>Sesi</td><td>: {j.Sesi}</td></tr>
            <tr><td>Kelas</td><td>: {ROMAWI[j.Tingkat] || j.Tingkat}</td><td style={{ paddingLeft: '12mm' }}>Waktu</td><td>: Jam ke-{ke({ Tanggal: j.Tanggal, JamMulai: j.JamMulai })}, {j.JamMulai} – {j.JamSelesai} WITA</td></tr>
          </tbody></table>
          <table className="dh">
            <thead>
              <tr><th style={{ width: '8mm' }}>No</th><th style={{ width: '22mm' }}>No. Peserta</th><th>Nama Peserta</th><th style={{ width: '12mm' }}>Kelas</th><th colSpan="2">Tanda Tangan</th><th style={{ width: '14mm' }}>Ket.</th></tr>
            </thead>
            <tbody>
              {peserta.map((x, k) => {
                const n = k + 1;
                return (
                  <tr key={x.NoPeserta}>
                    <td style={{ textAlign: 'center' }}>{n}</td>
                    <td style={{ textAlign: 'center' }}>{x.NoPeserta}</td>

          </table>
          <div className="dh-foot">
            <div>
              <table className="info-cetak"><tbody>
                <tr><td>Jumlah peserta seharusnya</td><td>: <b>{peserta.length}</b> orang</td></tr>
                <tr><td>Jumlah peserta hadir</td><td>: ........ orang</td></tr>
                <tr><td>Jumlah peserta tidak hadir</td><td>: ........ orang</td></tr>
              </tbody></table>
              <div className="hint" style={{ color: '#000', fontSize: '8.5pt' }}>Ket: S = Sakit, I = Izin, A = Tanpa keterangan</div>
            </div>
            <div style={{ textAlign: 'center', minWidth: '65mm' }}>
              {s.kota}, {fmtTanggal(j.Tanggal, false)}<br />Pengawas,
              <div className="sp" />
              (.......................................................)<br />
              <div style={{ textAlign: 'left', marginTop: '1mm' }}>NIP.</div>
            </div>
          </div>
        </div>}
        {jenis !== 'hadir' && <BeritaAcara s={s} j={j} r={r} peserta={peserta} namaMapel={mapel[j.KodeMapel] || j.KodeMapel} jamKe={ke({ Tanggal: j.Tanggal, JamMulai: j.JamMulai })} hadir={d.kehadiran && d.kehadiran[j.ID] ? d.kehadiran[j.ID] : null} />}
        </React.Fragment>
      ))}
    </>
  );
}

        <button className="btn primary" onClick={save}>💾 Simpan</button>
      </div>
      <div>
        <form className="card" onSubmit={gantiPw}>
          <h3 style={{ marginTop: 0 }}>Ganti password admin</h3>
          <label>Password lama<input type="password" value={pw.lama} onChange={e => setPw({ ...pw, lama: e.target.value })} required /></label>

          </div>
        )}

    </div>
  );
}

  const rekapSemua = async () => {
    try {
      const r = await api('rekapSemua');
      const wb = XLSX.utils.book_new();
      Object.keys(r.kolom).sort().forEach(t => {
        const kol = r.kolom[t];
        const rows = r.siswa.filter(s => s.Tingkat === t).map((s, i) => {

          kol.forEach(k => { const v = s[k]; o[k] = v == null ? '' : (typeof v === 'string' ? v.replace('.', ',') : v); });
          return o;
        });

      });
      if (!wb.SheetNames.length) return notify('Belum ada hasil ulangan', 'err');
